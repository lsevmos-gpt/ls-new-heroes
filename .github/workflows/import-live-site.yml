name: Import current ls-promo.ru

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/trigger-import-live.txt'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current production site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          python3 - <<'PY'
          import re
          import urllib.request
          import urllib.parse
          from pathlib import Path

          BASE = 'https://ls-promo.ru'
          OUT = Path('site')
          OUT.mkdir(parents=True, exist_ok=True)

          seeds = [
              '/',
              '/robots.txt',
              '/sitemap.xml',
              '/site.webmanifest',
              '/favicon.ico',
              '/assets/images/og.jpg',
              '/assets/images/brand/logo.png',
              '/assets/images/brand/favicon.png',
              '/assets/audio/formation-b.m4a',
              '/assets/images/desktop/intro-cardio.webp',
              '/assets/images/mobile/intro-cardio.webp',
          ]

          for scope in ('desktop','mobile'):
              for n in ('01','02','04','05','06','07'):
                  seeds.append(f'/assets/images/{scope}/intro-{n}.webp')

          for part in (
              '00','01','02','03','04','05','06','07a','07b','08'
          ):
              seeds.append(f'/assets/audio/formation-final-{part}.txt')

          seen=set()
          queue=list(seeds)

          def sanitize(path):
              parsed=urllib.parse.urlparse(path)
              p=parsed.path or '/'
              if not p.startswith('/'):
                  p='/'+p
              return p

          def local_path(path):
              p=sanitize(path)
              if p=='/':
                  return OUT/'index.html'
              if p.endswith('/'):
                  return OUT/p.lstrip('/')/'index.html'
              return OUT/p.lstrip('/')

          def fetch(path):
              p=sanitize(path)
              req=urllib.request.Request(
                  BASE+p,
                  headers={'User-Agent':'Mozilla/5.0 ls-new-heroes-migration'}
              )
              with urllib.request.urlopen(req, timeout=45) as r:
                  data=r.read()
                  ctype=r.headers.get('Content-Type','')
              dest=local_path(p)
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(data)
              print('OK',p,len(data))
              return p,data,ctype,dest

          def discover(text):
              found=set()
              patterns=[
                  r'''(?:src|href)=["']([^"'#]+)''',
                  r'''url\(["']?([^"')?#]+)''',
                  r'''["'](/assets/[^"'?#]+)["']''',
              ]
              for pat in patterns:
                  for raw in re.findall(pat,text,re.I):
                      if raw.startswith('http://') or raw.startswith('https://') or raw.startswith('//'):
                          try:
                              u=urllib.parse.urlparse(raw)
                              if u.netloc!='ls-promo.ru':
                                  continue
                              raw=u.path
                          except Exception:
                              continue
                      if not raw.startswith('/'):
                          continue
                      p=sanitize(raw)
                      if p.startswith('/assets/') or p in ('/robots.txt','/sitemap.xml','/site.webmanifest','/favicon.ico'):
                          found.add(p)
              return found

          while queue:
              raw=queue.pop(0)
              p=sanitize(raw)
              if p in seen:
                  continue
              seen.add(p)
              try:
                  p,data,ctype,dest=fetch(p)
              except Exception as e:
                  print('SKIP',p,repr(e))
                  continue

              suffix=dest.suffix.lower()
              if ctype.startswith('text/') or suffix in ('.html','.htm','.css','.js','.json','.xml','.txt','.webmanifest'):
                  text=data.decode('utf-8','ignore')
                  for item in sorted(discover(text)):
                      if item not in seen:
                          queue.append(item)

          print('Imported files:')
          for f in sorted(OUT.rglob('*')):
              if f.is_file():
                  print(f, f.stat().st_size)
          PY

          test -s site/index.html
          grep -Fq 'Линия спорта' site/index.html
          grep -Fq 'ГРАФИТОВЫЙ' site/index.html
          test -s site/assets/js/app-v5.js
          test -s site/assets/js/intro-postlude-v1.js
          test -s site/assets/css/seo-local.css
          test -s site/assets/audio/formation-b.m4a

      - name: Commit imported site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add site
          if git diff --cached --quiet; then
            echo "No site changes to commit."
          else
            git commit -m "Import current ls-promo.ru production site"
            git push
          fi
