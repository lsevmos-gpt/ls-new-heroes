name: Diagnose ls-promo.ru availability (read-only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ls-promo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public DNS resolution
        shell: bash
        run: |
          set +e
          for domain in ls-promo.ru www.ls-promo.ru server169.hosting.reg.ru; do
            echo "========== DNS: $domain =========="
            for resolver in 1.1.1.1 8.8.8.8; do
              echo "resolver=$resolver A:"
              dig @"$resolver" +time=4 +tries=1 "$domain" A +noall +answer +comments | head -18
              echo "resolver=$resolver AAAA:"
              dig @"$resolver" +time=4 +tries=1 "$domain" AAAA +short | head -8
            done
          done
          echo "========== AUTHORITY NS =========="
          dig @1.1.1.1 +time=4 +tries=1 ls-promo.ru NS +noall +answer +comments

      - name: Compare HTTP and HTTPS status and response headers
        shell: bash
        run: |
          set +e
          for address in "https://ls-promo.ru/" "http://ls-promo.ru/" "https://www.ls-promo.ru/" "https://liniyasporta.ru/" "https://promo.liniyasporta.ru/"; do
            echo "========== URL: $address =========="
            curl --noproxy '*' -sS -L -o /tmp/promo-response-body -D /tmp/promo-response-headers \
              --connect-timeout 7 --max-time 20 --retry 0 \
              -w 'result: status=%{http_code} resolved_ip=%{remote_ip} effective_url=%{url_effective} redirects=%{num_redirects} tls_verify=%{ssl_verify_result} duration=%{time_total}\n' \
              "$address"
            echo "curl_exit=$?"
            echo "--- headers ---"
            grep -Eai '^(HTTP/|server:|location:|content-type:|retry-after:|via:|x-powered-by:|x-cache:)' /tmp/promo-response-headers | tail -14
            echo "--- response snippet ---"
            head -c 180 /tmp/promo-response-body | tr '\n' ' '
            echo
          done

      - name: Verify authoritative REG.RU records and bypass DNS to origin
        shell: bash
        run: |
          set +e
          for server in ns1.reg.ru ns2.reg.ru; do
            echo "========== AUTHORITY: $server =========="
            for type in SOA NS A AAAA CNAME; do
              echo "type=$type"
              dig @"$server" +time=4 +tries=1 ls-promo.ru "$type" +noall +answer +authority +comments | head -20
            done
          done
          echo "========== BYPASS DNS: origin REG.RU =========="
          for url in "https://ls-promo.ru/" "http://ls-promo.ru/"; do
            echo "URL=$url"
            target_port=443
            case "$url" in http:*) target_port=80;; esac
            curl --noproxy '*' -k -sS -L -o /tmp/bypass-body -D /tmp/bypass-head \
              --resolve "ls-promo.ru:${target_port}:31.31.196.208" \
              --connect-timeout 8 --max-time 20 --retry 0 \
              -w 'result: status=%{http_code} ip=%{remote_ip} redirects=%{num_redirects} effective=%{url_effective} duration=%{time_total}\n' "$url"
            echo "curl_exit=$?"
            grep -Eai '^(HTTP/|server:|location:|content-type:|retry-after:|x-powered-by:)' /tmp/bypass-head | tail -12
            echo "snippet:"
            head -c 150 /tmp/bypass-body | tr '\n' ' '
            echo
          done

      - name: Check Cloudflare read-only bridge without modifying REG.RU
        shell: bash
        run: |
          set +e
          for url in "https://ls-reg-hosting-bridge.ls-evmos.workers.dev/health" "https://ls-reg-hosting-bridge.ls-evmos.workers.dev/probe/ls-promo"; do
            echo "========== CLOUDFLARE $url =========="
            curl -sS -L --connect-timeout 8 --max-time 20 \
              -w '\nHTTP_CODE=%{http_code}\n' "$url"
            echo "curl_exit=$?"
            echo
          done
